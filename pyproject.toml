[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cgx"
version = "0.1.0"
description = "Concept-guided explainability for a transformer in EEG abnormality detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["cgx*"]
